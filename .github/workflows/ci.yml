name: CI

# The path to production (approved 2026-10-13):
#   git push origin HEAD:candidate/<slug>
# runs gate (typecheck, lint ratchet, unit, integration, build) and the E2E
# suite in three shards. If every one of them passes, `promote` fast-forwards
# master to that exact commit. Vercel builds master as production, so that
# push is the deploy, made only from a commit that passed. A candidate that
# master has moved past is refused, never merged or forced. The
# "Expected on prod" note is then due before the candidate push, since that
# push is what deploys.
# Pushes to master still run all of this, minus `promote`.
on:
  push:
    branches: [master, 'candidate/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck (zero-error baseline)
        run: npx tsc --noEmit
      - name: Lint ratchet (no new ESLint problems)
        # app/, components/ and lib/ already hold 407 ESLint problems, so plain
        # `eslint` fails on every run. This fails only when a file/rule count
        # rises above scripts/lint-ratchet.baseline.json. About 16s locally.
        run: npm run lint:ratchet
      - name: Unit tests
        run: npx jest --config jest.config.js --maxWorkers=2
      - name: Integration tests
        run: npx jest --config jest.integration.config.js --maxWorkers=2
      - name: Production build
        run: npm run build

  # Audits PRODUCTION data for tokens stored in plaintext. Deliberately
  # workflow_dispatch-only: it is the one job that reads the production
  # database, so it must never fire on push/pull_request, where it would
  # bill every PR against production's data-transfer allowance.
  # The seed-path equivalent runs on every commit inside `e2e-prod`.
  prod-token-audit:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Plaintext-token guard (production data)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not configured"
            exit 1
          fi
          npx tsx scripts/assert-no-plaintext-tokens.ts

  # Self-contained E2E against a PRODUCTION build (next start), on a throwaway
  # Postgres service container. No repo secrets required — all secrets are
  # generated inline. Non-blocking: NOT part of the required `gate` check.
  # Except on candidate/**, where `promote` needs it.
  #
  # One shard on master and PRs, which is what this job did before. Three on a
  # candidate, each with its own Postgres seeded the same way, because promote
  # waits on the slowest shard, not on the sum of them.
  e2e-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(startsWith(github.ref, 'refs/heads/candidate/') && '[1, 2, 3]' || '[1]') }}
    concurrency:
      # The shard is in the group: all of them share one ref, and a group
      # without it would let each shard cancel the one before.
      group: e2e-prod-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outreach_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/outreach_e2e?schema=public
      E2E_BASE_URL: http://localhost:3010
      ANTHROPIC_API_KEY: sk-ci-placeholder
      # The suite spends exactly the production cap of 5 signups, so Playwright's
      # two CI retries push it over and the duplicate-email test then asserts
      # 201/409 against a 429. Headroom here only; production leaves this unset.
      SIGNUP_RATE_LIMIT_PER_HOUR: '100'
      # The suite makes no live platform reads. playwright.config.ts turns
      # YouTube's keyless plan B off for the server it starts, but this job
      # starts its own, so without this the suite read live watch pages: Track
      # wrote a real snapshot and took the ingestion page's "no snapshots"
      # empty state -- one of the contrast ratchet's recorded pairs -- off the
      # page.
      YOUTUBE_WATCH_PAGE_FALLBACK: 'off'
      # e2e/feedback.spec.ts reads the operator inbox as the seeded admin, as
      # .env.local allows locally.
      PLATFORM_ADMIN_EMAILS: admin@demo.com
      E2E_SHARDS: ${{ startsWith(github.ref, 'refs/heads/candidate/') && '3' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate throwaway secrets
        run: |
          echo "NEXTAUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Prisma generate + apply schema
        # `db push`, not `migrate deploy`: prisma/migrations cannot build a
        # database from scratch. 20 of the 72 models in schema.prisma have no
        # CREATE TABLE in any migration -- ViewLedger, DeliverableTypeDef,
        # Conversation, Message and 16 more -- because every real database here
        # (production, e2e, test) was provisioned with `db push` and the folder
        # was never kept whole. `migrate deploy` therefore died at
        # 20260720165317 on `column "reachCount" of relation "Post" does not
        # exist`, which failed this job on every commit since 2026-07-05.
        run: |
          npx prisma generate
          npx prisma db push

      - name: Seed database
        # prisma/seed.ts refuses to run without an explicit opt-in (added
        # 2026-08-31, so a seed can never reach production by accident). The
        # throwaway service container above is the case that opt-in exists for.
        env:
          SEED_ALLOW: "1"
        run: npx prisma db seed

      - name: Plaintext-token guard (throwaway DB, no secrets required)
        run: npx tsx scripts/assert-no-plaintext-tokens.ts

      - name: Build (production)
        env:
          NODE_ENV: production
        run: npm run build

      - name: Install Playwright browser
        # Every project in playwright.config.ts sets `channel: 'chrome'`, which
        # needs the Chrome distribution. The bundled chromium is a different
        # browser, so installing it leaves the suite unable to launch.
        run: npx playwright install --with-deps chrome

      - name: Start production server
        env:
          NODE_ENV: production
        run: |
          npx next start -p 3010 > next-start.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for server readiness
        run: |
          for i in $(seq 1 60); do
            # `|| echo 000` appended to curl's own -w output on failure, giving
            # "000000" -- which is != "000", so a server that never started was
            # declared ready and the failure surfaced later as an unexplained
            # Playwright error. Assign the fallback instead of appending it.
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3010/login) || code=000
            if [ "$code" != "000" ]; then
              echo "Server ready (HTTP $code) after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in time"
          cat next-start.log
          exit 1

      - name: Run E2E suite (production build)
        # No --workers override: playwright.config.ts runs 4 workers (files in
        # parallel; tests within a file in order unless the file opts out, as
        # contrast.spec.ts does; E2E_WORKERS overrides it), and a CLI flag
        # would silently outrank that.
        run: npx playwright test --shard=${{ matrix.shard }}/${{ env.E2E_SHARDS }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-start-log-${{ matrix.shard }}
          path: next-start.log
          retention-days: 7

  # Fast-forwards master to the candidate that just passed. It runs only when
  # the push was to candidate/**, and only after gate and every E2E shard
  # passed. checkout leaves HEAD at github.sha, so the commit promoted is the
  # one that was tested, never a newer one.
  #
  # Before this is enabled:
  # - A push made with GITHUB_TOKEN starts no workflow run. Vercel's Git
  #   integration still deploys master, but this workflow will not run again
  #   on that push. That is expected: the same commit has just passed it.
  # - If master is a protected branch, allow this workflow (github-actions[bot])
  #   to push to it. Otherwise this push is rejected.
  # - Production deploys need HEAD authored by prathamsharma7711@gmail.com.
  #   A fast-forward does not rewrite commits, so the candidate's own author
  #   reaches Vercel unchanged.
  promote:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/candidate/')
    needs: [gate, e2e-prod]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # Two candidates passing at once must not race for master: the second
      # is checked against master as the first one left it.
      group: promote-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward master to this candidate
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor origin/master HEAD; then
            echo "::error::master has commits this candidate does not -- rebase it onto origin/master and push it again. On master, not in the candidate:"
            git log --oneline HEAD..origin/master
            exit 1
          fi
          # No --force: a push that is not a fast-forward is rejected by git
          # itself, so the check above can only make this stricter.
          git push origin HEAD:refs/heads/master
